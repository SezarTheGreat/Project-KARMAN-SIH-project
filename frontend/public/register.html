<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your free KARMAN career workspace.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23162035'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='700' fill='%23F4C542' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<title>Create Account — KARMAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-shell">
    <div class="login-card">
      <a class="site-brand" href="index.html"><span class="logo-badge">K</span> KARMAN</a>
      <p class="sub">Create your career workspace — free for students & artisans</p>

      <button class="btn-social" onclick="window.location.href='dashboard.html'"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4C.5 8.3 0 10.1 0 12s.5 3.7 1.4 5.4z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1c.9-2.8 3.5-4.9 6.6-4.9z"/></svg> Continue with Google</button>

      <div class="login-divider">or sign up with email</div>

      <form id="signup-form" onsubmit="return handleSignup(event)">
        <div class="login-field">
          <label for="signup-name">Full name</label>
          <input id="signup-name" type="text" placeholder="Arjun Mehta" value="Arjun Mehta" required>
        </div>
        <div class="login-field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="arjun@karman.gov.in" value="arjun@karman.gov.in" required>
        </div>
        <div class="login-field">
          <label for="signup-role">I'm here as</label>
          <select id="signup-role" class="select-fake" style="width:100%;">
            <option value="student">Student (Career & Project Lab)</option>
            <option value="worker">Worker / Beneficiary (RPL & Scheme Grants)</option>
            <option value="officer">Field Officer / Admin</option>
          </select>
        </div>
        <div class="login-field">
          <label for="signup-pass">Password</label>
          <input id="signup-pass" type="password" placeholder="Create a password" minlength="8" value="password123" required>
        </div>
        <div class="login-field" style="margin-bottom:8px;">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" type="password" placeholder="Re-enter your password" minlength="8" value="password123" required>
        </div>
        <p id="signup-error" style="display:none; color:#B4432A; font-size:.78rem; margin:0 0 12px;">Passwords don't match — please check and try again.</p>
        <label style="display:flex; align-items:flex-start; gap:8px; font-size:.78rem; color:var(--ink-sub); margin-bottom:20px;">
          <input type="checkbox" required checked style="margin-top:2px;"> I agree to the Terms of Service and Privacy Policy
        </label>
        <button type="submit" class="btn-login-submit">Create Account →</button>
      </form>

      <p class="login-footer-note">Already have an account? <a href="login.html">Sign in</a></p>
      <p class="login-footer-note"><a href="index.html">← Back to home</a></p>
    </div>
  </div>

<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
